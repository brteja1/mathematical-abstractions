name: Verify AI test-design tooling

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install the pinned ONTFS backend in a virtual environment
        run: make deps-ontology
      - name: Test bounded retrieval and projection protections
        run: make PYTHON=.venv/bin/python test-ai
